<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#073443" />
    <meta
      name="description"
      content="BioData: explora organismos, células, genética y química. Aprende con lecciones, modelos interactivos y evaluaciones con progreso local."
    />
    <title>BioData 4 · La vida, conectada</title>
    <link rel="icon" href="assets/brand.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/modules.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#inicio"
        ><img src="assets/brand.svg" alt="" width="40" height="40" /><span
          >Bio<span>Data</span><small>LA VIDA, CONECTADA</small></span
        ><b>4.0</b></a
      >
      <p class="nav-label">TU UNIVERSO CIENTÍFICO</p>
      <nav id="navigation" aria-label="Áreas de aprendizaje"></nav>
      <div class="sidebar-bottom">
        <p>Tu aprendizaje <strong id="side-percent">0 %</strong></p>
        <progress
          id="side-progress"
          max="100"
          value="0"
          aria-label="Lecciones completadas"
        ></progress
        ><small id="side-caption">Cada descubrimiento cuenta.</small
        ><a href="#espacio" class="local-badge">◇ Guardado en este dispositivo</a>
      </div>
    </aside>
    <button id="backdrop" class="backdrop" aria-label="Cerrar menú" hidden></button>
    <div class="workspace">
      <header class="topbar">
        <button
          id="menu-toggle"
          class="icon-button mobile-only"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          ☰
        </button>
        <div class="breadcrumb">
          EXPLORAR <span>/</span> <strong id="view-label">Inicio</strong>
        </div>
        <form id="global-form" class="global-search" role="search">
          <label class="sr-only" for="global-search">Buscar en toda la plataforma</label
          ><span aria-hidden="true">⌕</span
          ><input
            id="global-search"
            type="search"
            placeholder="¿Qué quieres descubrir?"
            autocomplete="off"
            aria-controls="search-results"
            aria-expanded="false"
          /><kbd>/</kbd>
        </form>
        <button
          id="theme-toggle"
          class="icon-button"
          aria-label="Activar modo oscuro"
          title="Cambiar tema"
        >
          ◐
        </button>
        <a class="avatar" href="#espacio" aria-label="Mi espacio de aprendizaje">BD</a>
        <div
          id="search-results"
          class="search-results"
          aria-label="Resultados globales"
          hidden
        ></div>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading" role="status">
          <span class="loading-orbit"></span>Cargando tu universo científico…
        </div>
      </main>
      <footer>
        <a href="#inicio">BioData <b>4.0.0</b></a
        ><span>Ciencia para comprender. Curiosidad para descubrir.</span
        ><a href="#biblioteca/fuentes">Fuentes y créditos ↗</a>
      </footer>
    </div>
    <div id="notifications" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript
      ><p>
        Activa JavaScript para utilizar las herramientas de BioData. Puedes consultar los recursos
        de
        <a href="https://openstax.org/books/biology-2e/pages/1-introduction">OpenStax Biology 2e</a
        >.
      </p></noscript
    >
  </body>
</html>
